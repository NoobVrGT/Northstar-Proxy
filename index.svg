<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%;">
      <iframe id="proxy-frame" src="about:blank"></iframe>
    </div>
  </foreignObject>
  <script><![CDATA[
    const targetUrl = "https://cdn.jsdelivr.net/gh/NoobVrGT/Northstar-Proxy@main/public/index.html";
    document.getElementById('proxy-frame').src = targetUrl;
  ]]></script>
</svg>
