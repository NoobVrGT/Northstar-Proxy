<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%; margin:0; padding:0;">
      <html>
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
          <title>NorthStar</title>
          
          <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@latest/dist/index.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/scramjet-controller@latest/dist/scramjet.all.js"></script>
          
          <script src="https://cdn.jsdelivr.net/gh/NoobVrGT/Northstar-Proxy@main/public/register-sw.js" defer="defer"></script>
          <script src="https://cdn.jsdelivr.net/gh/NoobVrGT/Northstar-Proxy@main/public/search.js" defer="defer"></script>
          <script src="https://cdn.jsdelivr.net/gh/NoobVrGT/Northstar-Proxy@main/public/index.js" defer="defer"></script>
        </head>
        <body style="margin:0; background:#0f0f0f; color:#fff; font-family:sans-serif;">
          <div style="display:flex; justify-content:center; align-items:center; flex-direction:column; margin-top:20vh;">
            <h1>NorthStar</h1>
          </div>
          <div style="display:flex; justify-content:center; margin-top:20px;">
            <form id="sj-form">
              <input id="sj-search-engine" value="https://www.google.com/search?q=%s" type="hidden" />
              <input id="sj-address" type="text" placeholder="Search the web freely" style="padding:10px; width:300px; border-radius:5px; border:none;" />
            </form>
          </div>
        </body>
      </html>
    </div>
  </foreignObject>
</svg>
