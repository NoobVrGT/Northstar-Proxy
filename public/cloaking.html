<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star - Cloaking</title>
    
    <style>
        body { 
            font-family: system-ui, sans-serif; 
            background: #111; 
            color: #f1f5f9; 
            margin: 0; 
            padding: 0; 
        }
        
        /* Glassmorphism navigation tabs matching other pages */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 25px 0;
        }
        .nav-tabs a {
            color: #a1a1aa;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
        }
        .nav-tabs a:hover {
            color: #fff;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.25), rgba(0, 162, 255, 0.25));
            border-color: rgba(0, 162, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0, 162, 255, 0.2);
            transform: translateY(-1px);
        }
        .nav-tabs a.active {
            color: #fff;
            background: linear-gradient(135deg, #10b981, #0ea5e9);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.35);
        }

        .cloaker-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 20px 50px 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 28px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            color: #fff;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            color: #cfcfda;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #334155;
            border-radius: 9px;
            background: #111;
            color: white;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: #0ea5e9;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #10b981, #0ea5e9);
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 10px;
        }

        .secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .preview {
            margin-top: 24px;
            padding: 15px;
            border-radius: 10px;
            background: #111;
            border: 1px solid #334155;
        }

        .preview-title {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .tab {
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tab img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .tab span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status {
            color: #10b981;
            font-size: 13px;
            margin-top: 15px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <nav class="nav-tabs">
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="cloaking.html" class="active">Cloaking</a>
        <a href="credits.html">Credits</a>
    </nav>

    <div class="cloaker-wrapper">
        <div class="container">
            <h1> Tab Cloaker</h1>
            

            <label>Preset</label>
            <select id="preset">
                <option value="custom">Custom</option>
                <option value="google">Google</option>
                <option value="youtube">YouTube</option>
                <option value="classroom">Google Classroom</option>
                <option value="canvas">Canvas</option>
                <option value="clever">Clever</option>
                <option value="wikipedia">Wikipedia</option>
                <option value="blank">Blank Tab</option>
            </select>

            <label>Normal tab title</label>
            <input
                id="titleInput"
                type="text"
                placeholder="Enter tab title"
                value="North Star"
            >

            <label>Favicon URL</label>
            <input
                id="faviconInput"
                type="url"
                placeholder="https://example.com/favicon.ico"
            >

            <label>Title when tab is inactive</label>
            <input
                id="awayInput"
                type="text"
                placeholder="Enter away title"
                value="Come back!"
            >

            <button id="applyBtn">
                Apply Tab Settings
            </button>

            <button class="secondary" id="resetBtn">
                Reset
            </button>

            <div class="preview">
                <div class="preview-title">TAB PREVIEW</div>

                <div class="tab">
                    <img id="previewIcon" alt="">
                    <span id="previewTitle">North Star</span>
                </div>

                <div class="status" id="status"></div>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        const presets = {
            custom: {
                title: "North Star",
                favicon: ""
            },
            google: {
                title: "Google",
                favicon: "https://www.google.com/favicon.ico"
            },
            youtube: {
                title: "YouTube",
                favicon: "https://www.youtube.com/favicon.ico"
            },
            classroom: {
                title: "Google Classroom",
                favicon: "https://ssl.gstatic.com/classroom/favicon.png"
            },
            canvas: {
                title: "Canvas",
                favicon: "https://cdn.jsdelivr.net/gh/NoobVrGT/Northstar-Proxy@main/canvas.ico"
            },
            clever: {
                title: "Clever | Portal",
                favicon: "https://cdn.jsdelivr.net/gh/NoobVrGT/Northstar-Proxy@main/clever.ico"
            },
            wikipedia: {
                title: "Wikipedia",
                favicon: "https://www.wikipedia.org/static/favicon/wikipedia.ico"
            },
            blank: {
                title: "New Tab",
                favicon: ""
            }
        };

        const preset = document.getElementById("preset");
        const titleInput = document.getElementById("titleInput");
        const faviconInput = document.getElementById("faviconInput");
        const awayInput = document.getElementById("awayInput");

        const applyBtn = document.getElementById("applyBtn");
        const resetBtn = document.getElementById("resetBtn");

        const previewTitle = document.getElementById("previewTitle");
        const previewIcon = document.getElementById("previewIcon");
        const status = document.getElementById("status");

        let normalTitle = localStorage.getItem("ns_normalTitle") || "North Star";
        let awayTitle = localStorage.getItem("ns_awayTitle") || "Come back!";
        let faviconUrl = localStorage.getItem("ns_faviconUrl") || "";

        if (localStorage.getItem("ns_normalTitle")) titleInput.value = normalTitle;
        if (localStorage.getItem("ns_awayTitle")) awayInput.value = awayTitle;
        if (localStorage.getItem("ns_faviconUrl")) faviconInput.value = faviconUrl;

        function getFaviconElement() {
            let icon = document.querySelector("link[rel~='icon']") || document.querySelector("link[rel*='icon']");
            if (!icon) {
                icon = document.createElement("link");
                icon.rel = "shortcut icon";
                document.head.appendChild(icon);
            }
            return icon;
        }

        function applySettingsToBrowser() {
            document.title = normalTitle;
            const icon = getFaviconElement();
            if (faviconUrl) {
                icon.href = faviconUrl;
            } else {
                icon.removeAttribute("href");
            }
        }

        function updatePreview() {
            previewTitle.textContent = titleInput.value || "North Star";
            if (faviconInput.value) {
                previewIcon.src = faviconInput.value;
                previewIcon.style.display = "block";
            } else {
                previewIcon.style.display = "none";
            }
        }

        preset.addEventListener("change", () => {
            const selected = presets[preset.value];
            if (!selected) return;

            titleInput.value = selected.title;
            faviconInput.value = selected.favicon;
            updatePreview();
        });

        titleInput.addEventListener("input", updatePreview);
        faviconInput.addEventListener("input", updatePreview);

        applyBtn.addEventListener("click", () => {
            normalTitle = titleInput.value || "North Star";
            awayTitle = awayInput.value || normalTitle;
            faviconUrl = faviconInput.value.trim();

            localStorage.setItem("ns_normalTitle", normalTitle);
            localStorage.setItem("ns_awayTitle", awayTitle);
            localStorage.setItem("ns_faviconUrl", faviconUrl);

            applySettingsToBrowser();
            status.textContent = "✓ Tab settings applied & saved!";
            updatePreview();
        });

        resetBtn.addEventListener("click", () => {
            titleInput.value = "North Star";
            faviconInput.value = "";
            awayInput.value = "Come back!";
            preset.value = "custom";

            normalTitle = "North Star";
            awayTitle = "Come back!";
            faviconUrl = "";

            localStorage.removeItem("ns_normalTitle");
            localStorage.removeItem("ns_awayTitle");
            localStorage.removeItem("ns_faviconUrl");

            applySettingsToBrowser();
            status.textContent = "✓ Reset complete!";
            updatePreview();
        });

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                document.title = awayTitle;
            } else {
                document.title = normalTitle;
            }
        });

        applySettingsToBrowser();
        updatePreview();
    </script>
</body>
</html>
