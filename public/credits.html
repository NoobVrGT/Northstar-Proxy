<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>North Star | Credits</title>
		<link rel="shortcut icon" href="favicon.ico" />
		<style>
			:root {
				--bg: #0f172a;
				--card-bg: #1e293b;
				--border: #334155;
				--text: #f1f5f9;
				--text-muted: #94a3b8;
				--accent: #38bdf8;
			}
			body {
				font-family: system-ui, -apple-system, sans-serif;
				background: var(--bg);
				color: var(--text);
				margin: 0;
				padding: 0;
			}
			.nav-tabs {
				display: flex;
				justify-content: center;
				gap: 8px;
				padding: 20px 0;
			}
			.nav-tabs a {
				color: var(--text-muted);
				text-decoration: none;
				padding: 8px 16px;
				border-radius: 8px;
				font-size: 14px;
				font-weight: 500;
				transition: all 0.2s;
			}
			.nav-tabs a:hover {
				color: var(--text);
				background: rgba(255, 255, 255, 0.05);
			}
			.nav-tabs a.active {
				color: var(--text);
				background: var(--card-bg);
				border: 1px solid var(--border);
			}
			main {
				max-width: 700px;
				margin: 2rem auto;
				padding: 0 1.5rem;
			}
			h1 {
				font-size: 1.5rem;
				margin-bottom: 1.5rem;
				font-weight: 600;
			}
			.card {
				background: var(--card-bg);
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 1.5rem;
				margin-bottom: 1rem;
			}
			.card h2 {
				font-size: 1.1rem;
				margin: 0 0 0.5rem 0;
			}
			.card p {
				color: var(--text-muted);
				font-size: 0.95rem;
				margin: 0 0 1rem 0;
				line-height: 1.5;
			}
			.card a {
				color: var(--accent);
				text-decoration: none;
				font-size: 0.9rem;
				font-weight: 500;
			}
			.card a:hover {
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<nav class="nav-tabs">
			<a href="index.html">Home</a>
			<a href="games.html">Games</a>
			<a href="credits.html" class="active">Credits</a>
		</nav>

		<main>
			<h1>Credits & Licenses</h1>
			
			<div class="card">
				<h2>Mercury Workshop</h2>
				<p>Base architecture and open-source tooling provided by the community.</p>
				<a href="https://github.com/MercuryWorkshop" target="_blank">View GitHub &rarr;</a>
			</div>

			<div class="card">
				<h2>Assets & Resources</h2>
				<p>Game catalogs, indexes, and frontend tools curated from open-source repositories.</p>
			</div>
		</main>
	</body>
</html>
